services:
  - type: web
    name: line-dashboard
    runtime: python
    rootDir: apps/line-dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATALOGGER_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_TARGET_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: DATABASE_PATH
        value: data/datalogger.sqlite3
      - key: LINE_HTTP_TIMEOUT_SECONDS
        value: "6"
